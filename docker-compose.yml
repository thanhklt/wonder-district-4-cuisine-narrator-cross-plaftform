services:
  # ─── TTS Service ───────────────────────────────────────
  tts:
    build:
      context: ./TTSService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8001}:8001"
    volumes:
      - ./storage/audio:/storage/audio
    environment:
      - PORT=8001
      - AUDIO_STORAGE_PATH=/storage/audio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── API Service (C#) ──────────────────────────────────
  api:
    build:
      context: ./Api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-5184}:5184"
    volumes:
      - ./storage/audio:/storage/audio
      - ./storage/qr:/storage/qr
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5184
      - ConnectionStrings__SQLServer=${ConnectionStrings__SQLServer}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS}
      - SESSION_EXPIRY_HOURS=${SESSION_EXPIRY_HOURS}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_URL=${VNPAY_URL}
      - VNPAY_RETURN_URL=https://${HOST_IP}/api/access/callback
      - TTS_URL=${TTS_URL}
      - AUDIO_STORAGE_PATH=/storage/audio
      - QR_STORAGE_PATH=/storage/qr
      - MOBILE_APP_URL=https://${HOST_IP}
    depends_on:
      tts:
        condition: service_healthy

  # ─── WebApp (Admin/Owner) ──────────────────────────────
  webapp:
    build:
      context: ./WebAdmin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-3001}:3001"
    environment:
      - NEXT_PUBLIC_WEBAPP_API_URL=https://${HOST_IP}
    depends_on:
      - api

  # ─── nginx HTTPS Reverse Proxy ────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - webapp
      - api
